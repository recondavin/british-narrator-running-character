<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layered person SVG rig demo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #230d4b;
      color: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      position: relative;
      background: #230d4b;
    }
    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #b80072;
    }
    object {
      width: min(86vw, 1050px);
      height: min(96vh, 1450px);
      filter: none;
    }
    aside {
      position: fixed;
      z-index: 10;
      top: 12px;
      right: 12px;
      left: auto;
      width: 300px;
      max-height: calc(100vh - 24px);
      padding: 16px;
      overflow: auto;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      background: #32196f;
    }
    h1 { margin: 0 0 8px; font-size: 1.1rem; }
    p { margin: 0 0 22px; color: #d9cdf5; line-height: 1.45; }
    #controls { display: none; }
    .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      background: #11c5c1;
      color: #17103a;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
    button.secondary { background: #ffd84d; }
    button.ghost { background: #7652d9; color: white; }
    label { display: grid; grid-template-columns: 1fr 52px; gap: 10px; margin: 13px 0 5px; }
    output { text-align: right; color: #8ff4eb; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: #ff3e91; }
    fieldset { border: 0; padding: 0; margin: 0 0 22px; }
    legend { color: #ffd84d; font-weight: 800; margin-bottom: 2px; }
    code { color: #8ff4eb; }
    @media (max-width: 820px) {
      .stage { min-height: 64vh; }
      aside {
        position: static;
        width: 100%;
        max-height: none;
        border: 0;
        border-top: 1px solid rgba(255,255,255,.12);
        border-radius: 0;
      }
      object { height: 62vh; width: 88vw; }
    }
    @media (max-resolution: 0.75dppx) {
      :root { font-size: 32px; }
      object { width: min(86vw, 2100px); height: min(96vh, 2900px); }
      aside {
        top: 24px;
        right: 24px;
        left: auto;
        width: 600px;
        max-height: calc(100vh - 48px);
        padding: 32px;
        border-radius: 32px;
      }
      .buttons { gap: 12px; margin-bottom: 20px; }
      button { padding: 12px 20px; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Character preview">
    <object id="person-object" data="person-rig-projected.svg?t=45&amp;v=187" type="image/svg+xml" aria-label="Layered SVG person"></object>
  </main>
  <aside>
    <h1>Person rig controls</h1>
    <div class="buttons" aria-label="View angle">
      <button id="front-view" class="ghost">Front</button>
      <button id="three-quarter-view">Front 45°</button>
      <button id="side-view" class="ghost">Side</button>
    </div>
    <div class="buttons">
      <button id="wave">Wave</button>
      <button id="walk" class="secondary">Walk cycle</button>
      <button id="run" class="secondary">Run</button>
      <button id="work-squat" class="secondary">Work squat</button>
      <button id="work-knee" class="secondary">Work one knee</button>
      <button id="neutral" class="ghost">Neutral</button>
      <button id="pivots" class="ghost">Show pivots</button>
    </div>
    <div id="controls"></div>
  </aside>

  <script>
    const joints = [
      ['rig-upper-body', 'Waist', -25, 25],
      ['rig-arm-left-upper', 'Left shoulder', -150, 100],
      ['rig-arm-left-forearm', 'Left elbow', -20, 150],
      ['rig-hand-left', 'Left wrist', -45, 45],
      ['rig-arm-right-upper', 'Right shoulder', -100, 150],
      ['rig-arm-right-forearm', 'Right elbow', -150, 20],
      ['rig-hand-right', 'Right wrist', -45, 45],
      ['rig-leg-left-upper', 'Left hip', -55, 55],
      ['rig-leg-left-lower', 'Left knee', -105, 105],
      ['rig-foot-left', 'Left ankle', -35, 35],
      ['rig-leg-right-upper', 'Right hip', -55, 55],
      ['rig-leg-right-lower', 'Right knee', -105, 105],
      ['rig-foot-right', 'Right ankle', -35, 35],
    ];

    const object = document.querySelector('#person-object');
    const controls = document.querySelector('#controls');
    const viewSources = {
      front: 'person-rig-candidate.svg?v=109',
      threeQuarter: 'person-rig-projected.svg?t=45&v=187',
      side: 'person-rig-side-candidate.svg?v=147',
    };
    let embeddedSource = viewSources.threeQuarter;
    let svg;
    let animationFrame = 0;
    let animationMode = null;
    let startTime = 0;
    const sliders = new Map();

    function joint(id) {
      return svg?.getElementById(id);
    }

    function setAngle(id, angle, updateSlider = true) {
      const element = joint(id);
      if (!element) return;
      const x = element.dataset.pivotX;
      const y = element.dataset.pivotY;
      element.setAttribute('transform', `rotate(${angle} ${x} ${y})`);
      if (updateSlider && sliders.has(id)) {
        const { input, output } = sliders.get(id);
        input.value = angle;
        output.value = `${Math.round(angle)}°`;
      }
    }

    function stopAnimation() {
      animationMode = null;
      cancelAnimationFrame(animationFrame);
    }

    function reset() {
      stopAnimation();
      for (const [id] of joints) setAngle(id, 0);
    }

    function renderControls() {
      const groups = [
        ['Core', joints.slice(0, 1)],
        ['Arms', joints.slice(1, 7)],
        ['Legs', joints.slice(7)],
      ];
      for (const [title, items] of groups) {
        const fieldset = document.createElement('fieldset');
        const legend = document.createElement('legend');
        legend.textContent = title;
        fieldset.append(legend);
        for (const [id, name, min, max] of items) {
          const label = document.createElement('label');
          const text = document.createElement('span');
          const output = document.createElement('output');
          const input = document.createElement('input');
          text.textContent = name;
          output.value = '0°';
          input.type = 'range';
          input.min = min;
          input.max = max;
          input.value = 0;
          input.dataset.joint = id;
          input.addEventListener('input', () => {
            stopAnimation();
            setAngle(id, Number(input.value));
          });
          label.append(text, output);
          fieldset.append(label, input);
          sliders.set(id, { input, output });
        }
        controls.append(fieldset);
      }
    }

    function initializeSvg() {
      const root = object.contentDocument?.documentElement;
      if (!root || root.localName !== 'svg') return false;
      if (svg === root) return true;
      svg = root;
      controls.replaceChildren();
      sliders.clear();
      renderControls();
      return true;
    }

    function animate(time) {
      if (!animationMode) return;
      const seconds = (time - startTime) / 1000;
      if (animationMode === 'wave') {
        const wave = Math.sin(seconds * 7);
        const settle = Math.sin(seconds * 3.5);
        setAngle('rig-arm-right-upper', -62 + settle * 3, false);
        setAngle('rig-arm-right-forearm', -112 + wave * 16, false);
        setAngle('rig-hand-right', wave * 20, false);
        setAngle('rig-arm-left-upper', -4 - settle * 2, false);
        setAngle('rig-hand-left', settle * 5, false);
        setAngle('rig-leg-left-upper', settle * 0.5, false);
        setAngle('rig-leg-right-upper', -settle * 0.5, false);
        setAngle('rig-upper-body', -2 + settle * 1.5, false);
      } else if (animationMode === 'walk') {
        const swing = Math.sin(seconds * 5);
        const bendLeft = Math.max(0, -swing) * 42;
        const bendRight = Math.max(0, swing) * 42;
        setAngle('rig-leg-left-upper', swing * 25, false);
        setAngle('rig-leg-right-upper', -swing * 25, false);
        setAngle('rig-leg-left-lower', bendLeft, false);
        setAngle('rig-leg-right-lower', bendRight, false);
        setAngle('rig-arm-left-upper', -swing * 22, false);
        setAngle('rig-arm-right-upper', swing * 22, false);
        setAngle('rig-upper-body', Math.sin(seconds * 10) * 1.5, false);
      }
      animationFrame = requestAnimationFrame(animate);
    }

    function play(mode) {
      if (!svg && !initializeSvg()) return;
      reset();
      animationMode = mode;
      startTime = performance.now();
      animationFrame = requestAnimationFrame(animate);
    }

    function playEmbedded(mode) {
      object.setAttribute('data', `${embeddedSource}&run=${Date.now()}#${mode}`);
    }

    function showView(view) {
      embeddedSource = viewSources[view];
      document.querySelector('#front-view').classList.toggle('ghost', view !== 'front');
      document.querySelector('#three-quarter-view').classList.toggle('ghost', view !== 'threeQuarter');
      document.querySelector('#side-view').classList.toggle('ghost', view !== 'side');
      playEmbedded('neutral');
    }

    object.addEventListener('load', initializeSvg);
    document.querySelector('#neutral').addEventListener('click', () => playEmbedded('neutral'));
    document.querySelector('#wave').addEventListener('click', () => playEmbedded('wave'));
    document.querySelector('#walk').addEventListener('click', () => playEmbedded('walk'));
    document.querySelector('#run').addEventListener('click', () => playEmbedded('run'));
    function playWorkPose(mode) {
      if (embeddedSource === viewSources.front) showView('threeQuarter');
      playEmbedded(mode);
    }
    document.querySelector('#work-squat').addEventListener('click', () => playWorkPose('work-deep-squat'));
    document.querySelector('#work-knee').addEventListener('click', () => playWorkPose('work-one-knee'));
    document.querySelector('#front-view').addEventListener('click', () => showView('front'));
    document.querySelector('#three-quarter-view').addEventListener('click', () => showView('threeQuarter'));
    document.querySelector('#side-view').addEventListener('click', () => showView('side'));
    document.querySelector('#pivots').addEventListener('click', () => {
      if (svg || initializeSvg()) svg.classList.toggle('show-pivots');
    });
    initializeSvg();
  </script>
</body>
</html>
